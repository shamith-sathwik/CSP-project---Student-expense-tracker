<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header class="topbar">
    <div>
        <p class="eyebrow">STUDENT LIFE, SMARTER MONEY</p>
        <h1>Expense Tracker</h1>
        <p class="subtitle">Keep your monthly spending under control.</p>
    </div>

    <div class="header-controls">
        <div class="month-control">
            <label for="monthFilter">Month</label>
            <input type="month" id="monthFilter">
        </div>
        <div class="user-control">
            <span id="userDisplay"></span>
            <button id="logoutBtn" type="button">Logout</button>
        </div>
    </div>
</header>

<main class="dashboard">
    <section class="panel">
        <h2>Statistics</h2>
        <div class="stat-grid">
            <div class="stat-card">
                <span>Total Spent</span>
                <strong id="totalSpent">₹0</strong>
            </div>
            <div class="stat-card">
                <span>Monthly Budget</span>
                <strong id="budgetValue">₹5000</strong>
            </div>
            <div class="stat-card">
                <span>Remaining</span>
                <strong id="remaining">₹5000</strong>
            </div>
        </div>

        <h3>Monthly Expense Distribution</h3>
        <div class="chart-wrap">
            <canvas id="categoryChart"></canvas>
        </div>

        <h3>Spending by Category</h3>
        <div class="chart-wrap bar-wrap">
            <canvas id="barChart"></canvas>
        </div>
    </section>

    <section class="panel">
        <h2>Add Expense</h2>
        <div class="budget-box">
            <label for="budgetInput">Monthly Budget (₹)</label>
            <div class="budget-row">
                <input type="number" id="budgetInput" value="5000" min="0">
                <button id="saveBudget" type="button">Set</button>
            </div>
            <div class="progress-track">
                <div id="budgetProgress"></div>
            </div>
            <p id="budgetMessage"></p>
        </div>

        <form id="expenseForm">
            <label for="category">Category</label>
            <select id="category" required>
                <option value="Food">Food</option>
                <!--option value="Hostel">Hostel</option-->
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>

            <label for="amount">Amount (₹)</label>
            <input type="number" id="amount" placeholder="Enter amount" min="0.01" step="0.01" required>

            <label for="date">Date</label>
            <input type="date" id="date" required>

            <label for="note">Note</label>
            <input type="text" id="note" placeholder="Example: Lunch">

            <button type="submit" class="primary-btn">Save Expense</button>
            <p id="formMessage"></p>
        </form>
    </section>

    <section class="panel">
        <h2>History</h2>
        <button id="downloadReport" type="button">Download Monthly CSV</button>
        <div id="expenseList"></div>
        <p id="emptyState">No expenses for this month yet.</p>
    </section>
</main>

<footer>
    <p>Student Expense Tracker </p>
</footer>

<script src="script.js"></script>
</body>
</html>
